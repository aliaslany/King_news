<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="King News — daily news from Merzad's Telegram channel" />
  <title>King News — Daily Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#060912;--panel:rgba(15,22,37,.72);--line:rgba(255,255,255,.09);--text:#eef4ff;--muted:#8490a8;--cyan:#53d8ff;--violet:#9b7cff;--green:#54e6a7}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 5%,rgba(83,216,255,.12),transparent 30%),radial-gradient(circle at 85% 10%,rgba(155,124,255,.14),transparent 28%),var(--bg);color:var(--text);font-family:Vazirmatn,Inter,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
    header{position:sticky;top:0;z-index:10;background:rgba(6,9,18,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;color:#06101a;box-shadow:0 0 30px rgba(83,216,255,.2)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);border-radius:10px;padding:9px 13px;cursor:pointer;font:inherit}.btn:hover{background:rgba(255,255,255,.08)}
    main{max-width:1180px;margin:auto;padding:72px 22px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:30px;align-items:end;margin-bottom:42px}.eyebrow{color:var(--cyan);font-size:13px;font-weight:700;letter-spacing:.08em}.hero h1{font-size:clamp(40px,7vw,78px);line-height:1;margin:14px 0 20px;letter-spacing:-.04em}.hero p{color:var(--muted);font-size:17px;max-width:650px;line-height:1.9}.status{justify-self:end;width:100%;max-width:290px;padding:20px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.2)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green);margin-left:7px}.status small{color:var(--muted)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.toolbar h2{margin:0;font-size:24px}.count{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{position:relative;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,27,46,.88),rgba(10,15,27,.72));border-radius:22px;padding:22px;min-height:250px;transition:.25s;animation:up .5s ease both}.card:hover{transform:translateY(-5px);border-color:rgba(83,216,255,.35);box-shadow:0 22px 55px rgba(0,0,0,.28)}.card:after{content:"";position:absolute;top:0;right:18%;width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.7}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:18px}.card h3{font-size:19px;line-height:1.65;margin:0 0 12px}.card p{color:#aab4c9;line-height:1.8;font-size:14px;margin:0 0 20px}.read{display:inline-flex;color:var(--cyan);text-decoration:none;font-size:13px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:70px;border:1px dashed var(--line);border-radius:22px;grid-column:1/-1}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
    footer{max-width:1180px;margin:auto;padding:30px 22px 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
    @media(max-width:850px){.hero{grid-template-columns:1fr}.status{justify-self:stretch;max-width:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero{margin-bottom:28px}main{padding-top:48px}}
  </style>
</head>
<body>
<header><nav class="nav"><div class="brand"><span class="logo">K</span><span id="brand">King News</span></div><div class="actions"><button class="btn" id="lang">EN</button><button class="btn" id="refresh">↻ <span id="refreshText">به‌روزرسانی</span></button></div></nav></header>
<main>
<section class="hero"><div><div class="eyebrow" id="eyebrow">DAILY INTELLIGENCE · MERZAD</div><h1 id="title">نبض خبر، هر روز.</h1><p id="intro">اخبار و پست‌های ۲۴ ساعت گذشته از کانال مرزاد، در یک فضای سریع، مینیمال و تکنولوژیک.</p></div><div class="status"><div><span class="dot"></span><strong id="statusTitle">منبع فعال</strong></div><small id="statusText">آخرین دریافت: —</small></div></section>
<section><div class="toolbar"><h2 id="latest">آخرین اخبار</h2><span class="count" id="count">در حال دریافت...</span></div><div class="grid" id="news"></div></section>
</main><footer><span id="footer">منبع: کانال مرزاد در تلگرام · بروزرسانی خودکار روزانه</span></footer>
<script>
const state={fa:true,data:[]};
const copy={fa:{brand:'King News',eyebrow:'DAILY INTELLIGENCE · MERZAD',title:'نبض خبر، هر روز.',intro:'اخبار و پست‌های ۲۴ ساعت گذشته از کانال مرزاد، در یک فضای سریع، مینیمال و تکنولوژیک.',statusTitle:'منبع فعال',latest:'آخرین اخبار',count:n=>`${n} خبر`,refresh:'به‌روزرسانی',footer:'منبع: کانال مرزاد در تلگرام · بروزرسانی خودکار روزانه',empty:'برای امروز خبری دریافت نشده است.'},en:{brand:'King News',eyebrow:'DAILY INTELLIGENCE · MERZAD',title:'The pulse of news, daily.',intro:'News and posts from the last 24 hours of Merzad’s channel, presented in a fast, minimal and technological interface.',statusTitle:'Source online',latest:'Latest news',count:n=>`${n} stories`,refresh:'Refresh',footer:'Source: Merzad Telegram channel · Daily automatic update',empty:'No stories were received today.'}};
function render(){const c=copy[state.fa?'fa':'en'];document.documentElement.lang=state.fa?'fa':'en';document.documentElement.dir=state.fa?'rtl':'ltr';['brand','eyebrow','title','intro','statusTitle','latest','refreshText','footer'].forEach(id=>document.getElementById(id).textContent=c[id]);document.getElementById('lang').textContent=state.fa?'EN':'FA';document.getElementById('count').textContent=c.count(state.data.length);const root=document.getElementById('news');root.innerHTML=state.data.length?state.data.map((x,i)=>`<article class="card" style="animation-delay:${i*45}ms"><div class="meta"><span>${escapeHtml(x.date||'')}</span><span>${escapeHtml(x.category||'NEWS')}</span></div><h3>${escapeHtml(state.fa?(x.title_fa||x.title||'خبر'): (x.title_en||x.title||'News'))}</h3>${(x.summary_fa||x.summary_en||x.summary)?`<p>${escapeHtml(state.fa?(x.summary_fa||x.summary||''):(x.summary_en||x.summary||''))}</p>`:''}<a class="read" target="_blank" rel="noopener" href="${safeUrl(x.url)}">${state.fa?'مشاهده در تلگرام ←':'View on Telegram →'}</a></article>`).join(''):`<div class="empty">${c.empty}</div>`;document.getElementById('statusText').textContent=state.data.length?(state.fa?'آخرین دریافت: امروز':'Last fetch: today'):(state.fa?'آخرین دریافت: —':'Last fetch: —')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function safeUrl(v){try{const u=new URL(v||'#');return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
async function load(){try{const r=await fetch('./news.json?'+Date.now());if(!r.ok)throw Error();const j=await r.json();state.data=Array.isArray(j)?j:(j.news||[])}catch(e){state.data=[]}render()}document.getElementById('lang').onclick=()=>{state.fa=!state.fa;render()};document.getElementById('refresh').onclick=load;load();
</script></body></html>

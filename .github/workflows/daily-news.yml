name: Daily King News

on:
  schedule:
    # Once per day, with a little randomness around the exact minute.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Telegram client
        run: pip install 'telethon>=1.44,<2'

      - name: Collect previous 24 hours
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNEL: dlmehr
        run: python scripts/fetch_news.py

      - name: Commit daily cards
        run: |
          git config user.name 'King News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --cached --quiet || git commit -m "chore: update daily technology news"
          git push

name: Daily King News

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape public Telegram list posts
        working-directory: scripts
        run: python scrape_list_news.py

      - name: Commit daily cards
        run: |
          git config user.name 'King News Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add news.json
          git diff --cached --quiet || git commit -m "chore: update daily technology signals"
          git push
